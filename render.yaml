services:
  - type: web
    name: citeverify-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip uninstall -y opencv-python && pip install --no-cache-dir opencv-python-headless
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: STORAGE_MODE
        value: postgres
      - key: MAX_UPLOAD_MB
        value: "25"
